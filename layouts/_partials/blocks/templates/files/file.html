{{ if partial "GetMedia" .id }}
  <li{{ if .image }} class="with-image"{{ end }}>
    <figure>
      {{ partial "commons/files/download-link.html" (dict
        "id" .id
        "title" .title
        "with_caption" true
      ) }}
    </figure>
    {{ with .image }}
      {{ partial "commons/image.html" (dict
        "image" .
        "sizes" site.Params.image_sizes.blocks.files
      ) }}
    {{ end }}
  </li>
{{ end }}
