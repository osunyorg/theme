{{ $files := .Paginator.Pages }}
{{ $layout := default site.Params.files.index.layout }}
{{ $options := default site.Params.files.index.options }}
{{ $heading_level := 2 }}

<ul class="files files--{{ $layout }}">
  {{ range $files }}
    {{ partial "files/partials/file.html" (dict
      "file" .
      "download" false
      "context" .
    ) }}
  {{ end }}
</ul>
