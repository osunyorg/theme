# Pagefind reads this file from the directory it runs in: run it from the theme directory.
# Paths are relative to the theme, which is in themes/osuny (or node_modules/osuny).
site: ../../public
glob: "**/index.{html}"
exclude_selectors:
  - .block-agenda
  - .block-diplomas
  - .block-categories
  - .block-exhibitions
  - .block-jobs
  - .block-locations
  - .block-organizations
  - .block-pages
  - .block-papers
  - .block-persons
  - .block-posts
  - .block-programs
  - .block-projects
  - .block-publications
  - .block-volumes
  - .person-objects
  - .person-papers
  - .person-posts
  - .person-programs
  - .person-publications
  - .program-related
  - .post-sidebar
  - .events
  - .exhibitions
  - .jobs
  - .journals
  - .laboratories
  - .organizations
  - .pages
  - .papers
  - .persons
  - .posts
  - .programs
  - .projects
  - .publications
  - .schools
  - .volumes
